[project]
name = "crucible"
version = "0.11.1"
description = "Equity research MVP: filings -> maintained model -> adversarially stress-tested assumptions with evidence attribution"
requires-python = ">=3.10"
dependencies = [
    "edgartools>=5.50",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "pyarrow>=14",
]

readme = "README.md"
license = {text = "MIT"}
keywords = ["equity research", "SEC filings", "XBRL", "financial model", "DCF", "LLM"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent",
               "Topic :: Office/Business :: Financial :: Investment"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
market = ["yfinance>=0.2"]
ui = ["streamlit>=1.40"]
dev = ["pytest>=7"]
all = ["anthropic>=1.0", "yfinance>=0.2", "streamlit>=1.40", "pytest>=7"]

[project.urls]
Homepage = "https://github.com/jiashengcheng1-lab/crucible"
Issues = "https://github.com/jiashengcheng1-lab/crucible/issues"

[project.scripts]
crucible = "crucible.cli:main"
crucible-ui = "crucible.ui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.setuptools.package-data]
crucible = ["rules/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
